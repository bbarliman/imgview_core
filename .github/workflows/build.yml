name: Build ImgView core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Analogue core template (provides apf/ + Quartus project)
        uses: actions/checkout@v4
        with:
          repository: open-fpga/core-template
          path: template

      - name: Overlay our core_top.v
        run: cp src/fpga/core/core_top.v template/src/fpga/core/core_top.v

      - name: Compile with Quartus Prime Lite 21.1
        run: |
          docker run --rm \
            -v "$PWD/template/src/fpga:/build" -w /build \
            raetro/quartus:21.1 \
            quartus_sh --flow compile ap_core

      - name: Make sure we have an .rbf
        run: |
          cd template/src/fpga/output_files
          ls -la
          if [ ! -f ap_core.rbf ]; then
            docker run --rm -v "$PWD:/out" -w /out raetro/quartus:21.1 \
              quartus_cpf -c ap_core.sof ap_core.rbf
          fi

      - name: Bit-reverse rbf -> bitstream.rbf_r and package SD-card layout
        run: |
          CORE=package/Cores/Custom.ImgView
          mkdir -p "$CORE" package/Platforms
          python3 - <<'PY'
          src = "template/src/fpga/output_files/ap_core.rbf"
          dst = "package/Cores/Custom.ImgView/bitstream.rbf_r"
          table = bytes(int(f"{i:08b}"[::-1], 2) for i in range(256))
          open(dst, "wb").write(open(src, "rb").read().translate(table))
          PY
          cp dist/Cores/Custom.ImgView/*.json "$CORE"/
          cp dist/Platforms/*.json package/Platforms/
          # icon.bin is not generated here; reuse the template's if it ships one
          find template -name icon.bin -print -quit | xargs -r -I{} cp {} "$CORE"/icon.bin
          ls -R package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom.ImgView
          path: package/
          if-no-files-found: error

      - name: Upload Quartus reports (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: template/src/fpga/output_files/*.rpt
